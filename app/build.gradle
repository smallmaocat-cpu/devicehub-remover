plugins {
    id 'com.android.application'
}

/* 固定签名。
 * 为什么需要：默认的 debug keystore 是每次构建临时生成的，v1.0.1 / v1.0.2 / v1.0.3
 * 三个版本的签名互不相同，安卓会认为它们是不同的应用，用户每次升级都必须先卸载，
 * 而卸载会丢掉设置和之前的日志。
 * 做法：CI 从 Secret 里解出一份固定 keystore，用 KEYSTORE_PATH 传进来；本地没配这些
 * 环境变量时自动退回 debug 签名，保证「什么都不配也能编出能装的包」。 */
def ksPath = System.getenv('KEYSTORE_PATH')
def hasFixedKs = ksPath != null && new File(ksPath).isFile()

android {
    namespace 'io.github.smallmaocat.devicehubcleaner'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.smallmaocat.devicehubcleaner'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.0.4'
    }
    signingConfigs {
        if (hasFixedKs) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEYSTORE_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            /* R8 混淆：重命名类/字段/方法、删除未引用代码、内联；资源名同步收缩。
             * 保留规则见 app/proguard-rules.pro（JS 桥方法必须保名）。 */
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasFixedKs ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
