plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.smallmaocat.devicehubcleaner'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.smallmaocat.devicehubcleaner'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // 用 debug keystore 签名，装上就能用；正式发布可换成自己的 keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
