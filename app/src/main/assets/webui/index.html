<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>DeviceHub 清理器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-top">
    <div>
      <h1>DeviceHub 清理器</h1>
      <p class="sub" id="modeLine">读取中…</p>
    </div>
    <span class="badge idle" id="stateBadge">待机</span>
  </div>

  <div class="bar"><div class="bar-fill" id="barFill"></div></div>

  <div class="hero-meta">
    <span id="stageLine">尚未开始</span>
    <span id="timeLine">—</span>
  </div>
  <p class="msg" id="msgLine"></p>
</header>

<nav class="actions">
  <button class="btn primary" id="btnRun">开始清理</button>
  <button class="btn" id="btnStop">停止守护</button>
  <button class="btn" id="btnLog">日志文件</button>
  <button class="btn" id="btnCfg">设置</button>
</nav>

<section class="card summary">
  <h2>本次结果</h2>
  <p id="summaryText">无运行记录。</p>
  <div class="chips" id="chips"></div>
</section>

<h2 class="section-title">运行阶段</h2>
<section class="stages" id="stages"></section>

<h2 class="section-title">实时日志 <small>滚动</small></h2>
<section class="logbox" id="logBox"><div class="logline muted">无日志</div></section>

<div class="sheet-mask hidden" id="mask"></div>

<section class="sheet hidden" id="cfgSheet">
  <h2>设置</h2>
  <label class="field">
    <span>日志输出目录</span>
    <input type="text" id="cfgLogDir" placeholder="/sdcard/DeviceHub清理日志">
    <em>日志与摘要输出目录，可写即可。</em>
  </label>
  <label class="field">
    <span>只报告不删除</span>
    <input type="checkbox" id="cfgReport">
    <em>只记录，不删除。</em>
  </label>
  <label class="field">
    <span>开机自动清理一次</span>
    <input type="checkbox" id="cfgBoot">
    <em>开机后自动跑一轮。</em>
  </label>
  <label class="field">
    <span>常驻守护</span>
    <input type="checkbox" id="cfgWatch">
    <em>完成后循环复查，发现即清。</em>
  </label>
  <label class="field">
    <span>守护间隔（秒）</span>
    <input type="number" id="cfgInterval" min="3" max="3600">
    <em>建议 6～60s，过短耗电。</em>
  </label>
  <label class="field">
    <span>日志回传地址</span>
    <input type="text" id="cfgUploadUrl" placeholder="https://…">
    <em>留空不回传。任意可收 multipart/form-data（字段 file）的 POST；Telegram sendDocument 按其格式发。</em>
  </label>
  <label class="field">
    <span>Telegram chat_id</span>
    <input type="text" id="cfgUploadChat" placeholder="仅 Telegram 需要">
    <em>@userinfobot 可取；群组为负数。</em>
  </label>
  <label class="field">
    <span>自动回传</span>
    <input type="checkbox" id="cfgUploadAuto">
    <em>跑完自动发到上面的地址。</em>
  </label>
  <div class="sheet-actions">
    <button class="btn primary" id="btnSaveCfg">保存</button>
    <button class="btn" id="btnCloseCfg">关闭</button>
  </div>
</section>

<section class="sheet hidden" id="logSheet">
  <h2>日志文件</h2>
  <div class="pathbox" id="logPath">—</div>
  <pre class="logfull" id="logFull">读取中…</pre>
  <div class="pathbox" id="uploadState">回传：未配置</div>
  <div class="sheet-actions">
    <button class="btn" id="btnCopyPath">复制路径</button>
    <button class="btn primary" id="btnUploadLog">立即回传</button>
    <button class="btn" id="btnCloseLog">关闭</button>
  </div>
</section>

<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
