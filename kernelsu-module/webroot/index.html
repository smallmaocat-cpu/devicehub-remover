<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>DeviceHub 清理器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-top">
    <div>
      <h1>DeviceHub 清理器</h1>
      <p class="sub" id="modeLine">正在读取状态…</p>
    </div>
    <span class="badge idle" id="stateBadge">待机</span>
  </div>

  <div class="bar"><div class="bar-fill" id="barFill"></div></div>

  <div class="hero-meta">
    <span id="stageLine">尚未开始</span>
    <span id="timeLine">—</span>
  </div>
  <p class="msg" id="msgLine"></p>
</header>

<nav class="actions">
  <button class="btn primary" id="btnRun">开始清理</button>
  <button class="btn" id="btnStop">停止守护</button>
  <button class="btn" id="btnLog">日志文件</button>
  <button class="btn" id="btnCfg">设置</button>
</nav>

<section class="card summary">
  <h2>这次的情况</h2>
  <p id="summaryText">还没有运行记录，点「开始清理」执行一次。</p>
  <div class="chips" id="chips"></div>
</section>

<h2 class="section-title">运行阶段 <small>点开看这一阶段在做什么、这次结果如何</small></h2>
<section class="stages" id="stages"></section>

<h2 class="section-title">实时日志 <small>边跑边更新</small></h2>
<section class="logbox" id="logBox"><div class="logline muted">等待日志…</div></section>

<div class="sheet-mask hidden" id="mask"></div>

<section class="sheet hidden" id="cfgSheet">
  <h2>设置</h2>
  <label class="field">
    <span>日志输出目录</span>
    <input type="text" id="cfgLogDir" placeholder="/sdcard/DeviceHub清理日志">
    <em>纯中文日志与总结文件会写到这个目录，可以改成任意可写路径。</em>
  </label>
  <label class="field">
    <span>只报告不删除</span>
    <input type="checkbox" id="cfgReport">
    <em>打开后只记录发现了什么，不会真的删除任何文件。</em>
  </label>
  <label class="field">
    <span>开机自动清理一次</span>
    <input type="checkbox" id="cfgBoot">
    <em>每次开机后自动跑一遍完整流程。</em>
  </label>
  <label class="field">
    <span>常驻守护</span>
    <input type="checkbox" id="cfgWatch">
    <em>清理完成后持续复查，发现东西重新出现就立刻再清一遍。</em>
  </label>
  <label class="field">
    <span>守护间隔（秒）</span>
    <input type="number" id="cfgInterval" min="3" max="3600">
    <em>建议 6～60 秒，太短会比较耗电。</em>
  </label>
  <div class="sheet-actions">
    <button class="btn primary" id="btnSaveCfg">保存</button>
    <button class="btn" id="btnCloseCfg">关闭</button>
  </div>
</section>

<section class="sheet hidden" id="logSheet">
  <h2>日志文件</h2>
  <div class="pathbox" id="logPath">—</div>
  <pre class="logfull" id="logFull">读取中…</pre>
  <div class="sheet-actions">
    <button class="btn" id="btnCopyPath">复制路径</button>
    <button class="btn" id="btnCloseLog">关闭</button>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
