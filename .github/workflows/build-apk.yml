name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          # 用纯 ASCII 文件名：中文名在上传 release 资产时会被规范化成 ".-"，看着像乱码
          cp app/build/outputs/apk/release/app-release.apk dist/DeviceHub-cleaner-v1.0.1.apk
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceHub-cleaner-apk
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: DeviceHub 清理器 v1.0.1
          body: |
            由 GitHub Actions 自动编译的 APK。

            本版修复：
            - release 资产文件名改为纯 ASCII（上版中文名被吞成 `DeviceHub-.-v1.0.0.apk`）
            - 补上应用图标：自适应图标（Android 8+）+ 矢量回退（Android 7.x），不再是默认绿机器人

            功能：
            - 界面：沿用 KernelSU WebUI 的 9 阶段进度界面，每个阶段可展开看说明与本次结论
            - 执行：通过 su -c 运行 assets/bin/dh-clean.sh
            - 日志：默认写到 /sdcard/DeviceHub清理日志，可在设置里改
          files: dist/DeviceHub-cleaner-v1.0.1.apk
          fail_on_unmatched_files: true
