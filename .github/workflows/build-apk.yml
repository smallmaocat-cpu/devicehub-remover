name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # 固定签名：有 Secret 就解出 keystore，没有则把 KEYSTORE_PATH 置空，build.gradle 退回 debug。
      - name: Decode keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "已解出固定 keystore，本次使用固定签名"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "未配置 KEYSTORE_BASE64，本次使用 debug 签名"
          fi
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p dist
          # 纯 ASCII 文件名：中文名上传 release 资产时会被规范化成 ".-"，看着像乱码
          cp app/build/outputs/apk/release/app-release.apk dist/DeviceHub-cleaner-v1.0.4.apk
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceHub-cleaner-apk
          path: dist/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: DeviceHub 清理器 v1.0.4
          body: |
            由 GitHub Actions 编译。

            本版：
            - 全量文案压缩：更短、术语化，去掉说明腔
            - release 启用 R8 混淆 + 资源收缩；JS 桥、Activity 已加 keep 规则
            - 日志回传、9 阶段清理、守护模式逻辑不变

            签名：
            - 配好 `KEYSTORE_*` 四个 Secret → 固定签名，可覆盖升级
            - 未配 → debug 签名，升级前须卸载（丢设置与旧日志）
            - 配法见 README「固定签名」

            用法：
            - 首启为权限说明页，点「检测 Root 权限」授权；3 秒后进主界面
            - 日志默认写 /sdcard/DeviceHub清理日志
            - 可选日志回传：multipart/form-data（字段 file）或 Telegram sendDocument
          files: dist/DeviceHub-cleaner-v1.0.4.apk
          fail_on_unmatched_files: true
